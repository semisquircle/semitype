<!DOCTYPE html>
<html>

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Compare</title>

	<link rel="stylesheet" href="css/fonts.css">
	<style>
		html, body {
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;
			width: 100%;
			height: 100%;
			background: black;
			margin: 0;
			overflow: hidden;

		#font-full-name {

			color: white;
		}

		#text {
			font-size: 250px;
			line-height: 1.1;
			color: white;
		}
	</style>
</head>

<body>
	<div id="font-full-name"></div>
	<div id="text">12:34PM NOW!</div>

	<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
	<script>
		const tombaughRegular = {

			weights: [
				{

		};
		const hades = {
			name: "Hades",

		const fonts = [

			// },
			// {
			// 	family: tombaughDisplay,
			// 	weightIndex: 5
			// },
		];
		var currentFont = 0;

		function changeFont(font) {
			$("#font-full-name").html(`${font.family.name} ${font.family.weights[font.weightIndex].name}`);
			$("#text").css({
				"font-family": font.family.name,
				"font-weight": font.family.weights[font.weightIndex].weight
			});
		}
		changeFont(fonts[currentFont]);

		$(document).on("keypress", (e) => {
			if (e.code == "Space") {
				currentFont = (currentFont + 1) % fonts.length;
				changeFont(fonts[currentFont]);
			}
		});
	</script>
